name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Fetch public semantic testcases
        run: git submodule update --init tests/official

      - name: Build C++ compiler and unit tests offline
        run: |
          cmake -S . -B build/oj -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DRX_JUDGE_BUILD=ON
          cmake --build build/oj -j2

      - name: Run unit tests
        run: ctest --test-dir build/oj --output-on-failure

      - name: Run semantic judge interface
        run: make test STAGE=semantic FILTER=official:semantic BUILD=': > {runtime}'
